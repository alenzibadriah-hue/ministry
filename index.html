/* Layout: brand-purple command rail on the right (RTL) + a calm violet-tinted workspace of rounded panels, echoing the identity's rounded palette cards and the logo's square dots. */
:root{
  --brand:#6045F5; --brand-strong:#4C33DE; --brand-soft:#EEEBFE; --brand-line:#D9D2FD; --on-brand:#FFFFFF;
  --rail:#6045F5; --rail-ink:#FFFFFF; --rail-muted:rgba(255,255,255,.68); --rail-hover:rgba(255,255,255,.12); --rail-active:#FFFFFF; --rail-active-ink:#4C33DE;
  --bg:#F5F4FB; --surface:#FFFFFF; --surface-2:#F1EFFA; --ink:#17142F; --ink-2:#47436A; --muted:#77739A; --line:#E5E2F4;
  --neg:#D93D52; --neg-soft:#FCEBEE; --warn:#B9740A; --warn-soft:#FCF1DE; --pos:#17865B; --pos-soft:#E3F4EC; --neu:#8C89A6; --neu-soft:#EFEEF5;
  --shadow:0 1px 2px rgba(23,20,47,.04),0 10px 30px -18px rgba(40,25,140,.28);
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --f-display:"Bukra","Azer","Segoe UI",Tahoma,sans-serif;
  --f-body:"Azer","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#7C66FF; --brand-strong:#9A89FF; --brand-soft:#241F4E; --brand-line:#3A3373; --on-brand:#FFFFFF;
  --rail:#1C1745; --rail-ink:#FFFFFF; --rail-muted:rgba(236,233,255,.62); --rail-hover:rgba(255,255,255,.07); --rail-active:#6045F5; --rail-active-ink:#FFFFFF;
  --bg:#0E0C1D; --surface:#17142C; --surface-2:#1F1B39; --ink:#EEECFB; --ink-2:#C4C0DF; --muted:#8F8BB0; --line:#2B2650;
  --neg:#F2697B; --neg-soft:#3A1824; --warn:#EBAE4A; --warn-soft:#382912; --pos:#43C690; --pos-soft:#103227; --neu:#8A86AB; --neu-soft:#25223C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#7C66FF; --brand-strong:#9A89FF; --brand-soft:#241F4E; --brand-line:#3A3373; --on-brand:#FFFFFF;
  --rail:#1C1745; --rail-ink:#FFFFFF; --rail-muted:rgba(236,233,255,.62); --rail-hover:rgba(255,255,255,.07); --rail-active:#6045F5; --rail-active-ink:#FFFFFF;
  --bg:#0E0C1D; --surface:#17142C; --surface-2:#1F1B39; --ink:#EEECFB; --ink-2:#C4C0DF; --muted:#8F8BB0; --line:#2B2650;
  --neg:#F2697B; --neg-soft:#3A1824; --warn:#EBAE4A; --warn-soft:#382912; --pos:#43C690; --pos-soft:#103227; --neu:#8A86AB; --neu-soft:#25223C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.35;text-wrap:balance}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;width:248px;flex:none;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;padding:26px 16px 18px;z-index:30}
.rail .logo{width:132px;color:var(--rail-ink);margin:2px 10px 6px}
.rail-tag{font-size:12px;color:var(--rail-muted);margin:-14px 10px 0;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11.5px;color:var(--rail-muted);padding:10px 12px 4px;letter-spacing:.4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--rail-ink);text-decoration:none;font-size:14.5px;transition:background .15s}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--rail-active);color:var(--rail-active-ink);font-weight:500}
.nav a svg{width:19px;height:19px;flex:none}
.nav a .count{margin-inline-start:auto;font-size:12px;opacity:.8}
.rail-ds{margin-top:auto;background:var(--rail-hover);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rail-ds small{color:var(--rail-muted);font-size:11.5px}
.rail-ds b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-ds span{font-size:12px;color:var(--rail-muted)}
.rail-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid transparent;background:transparent}
.rail .icon-btn{color:var(--rail-ink);background:var(--rail-hover)}
.icon-btn svg{width:18px;height:18px}
.org{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:11px;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
:root[data-theme="dark"] .avatar{color:#1C1745}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{color:#1C1745}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px max(16px,2.4vw)}
.top .menu{display:none}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb small{color:var(--muted);font-size:12px}
.crumb h1{font-size:19px}
.search{margin-inline-start:auto;position:relative;width:min(340px,100%)}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 14px}
.search svg{position:absolute;right:13px;top:12px;width:18px;height:18px;color:var(--muted)}
.view{padding:26px max(16px,2.4vw) 60px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}

/* ---------- primitives ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--brand-line);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;min-width:0}
.panel-h{flex-wrap:wrap;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-h h3{font-size:16px}
.panel-h p{color:var(--muted);font-size:13px;margin-top:2px}
.sq{display:inline-block;width:8px;height:8px;background:var(--brand);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.brand{background:var(--brand-soft);color:var(--brand-strong)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neu{background:var(--neu-soft);color:var(--neu)}
.dot{width:7px;height:7px;border-radius:2px;background:currentColor}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.select,.input{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;min-width:0}
.input:focus,.select:focus,.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
mark{background:var(--brand-soft);color:var(--brand-strong);border-radius:4px;padding:0 3px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- dashboard ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-head h2{font-size:clamp(22px,2.4vw,28px)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13.5px;margin-top:8px}
.meta-row .sep{width:4px;height:4px;background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.kpi{position:relative;padding:20px 22px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.kpi .k-label{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .k-val{font-family:var(--f-display);font-size:32px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:15px;color:var(--muted);margin-inline-start:4px;font-family:var(--f-body)}
.kpi .k-foot{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:500;display:inline-flex;align-items:center;gap:2px;direction:ltr}
.delta.up{color:var(--neg)}.delta.down{color:var(--pos)}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.hero .k-label,.kpi.hero .k-foot,.kpi.hero .k-val small{color:rgba(255,255,255,.8)}
.kpi.hero .delta.up,.kpi.hero .delta.down{color:#fff;background:rgba(255,255,255,.16);padding:0 6px;border-radius:6px}
.kpi.hero::after{content:"";position:absolute;left:18px;top:18px;width:14px;height:14px;background:rgba(255,255,255,.22);box-shadow:20px 0 0 rgba(255,255,255,.22)}

.cat-rows{display:flex;flex-direction:column;gap:4px}
.cat-row{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;align-items:center;gap:14px;padding:8px 10px;border-radius:12px;border:0;background:transparent;text-align:start;width:100%}
.cat-row:hover{background:var(--surface-2)}
.cat-row .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.cat-row:not(:first-child) .bar i{background:color-mix(in srgb,var(--brand) 62%,var(--surface))}
.cat-row .vals{display:flex;justify-content:flex-end;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.cat-row .vals b{font-weight:500}
.cat-row .vals span{color:var(--muted);min-width:34px;text-align:end}

.insight-card{display:flex;flex-direction:column;gap:14px}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.insights li{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px;line-height:1.75;color:var(--ink-2)}
.insights li .sq{margin-top:9px}
.insights b{color:var(--ink);font-weight:500}
.ai-box{border:1px dashed var(--brand-line);background:var(--brand-soft);border-radius:var(--r-md);padding:14px 16px;font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.ai-box[data-state="idle"]{display:flex;align-items:center;justify-content:space-between;gap:12px;white-space:normal;flex-wrap:wrap}
.ai-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--brand-strong);font-weight:500}
.ai-chip svg{width:15px;height:15px}

.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.donut-legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:140px}
.donut-legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.donut-legend b{margin-inline-start:auto;font-weight:500;font-variant-numeric:tabular-nums}
.donut-legend i{width:10px;height:10px;border-radius:3px}

.issues{display:flex;flex-direction:column}
.issue{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.issue:first-child{border-top:0;padding-top:4px}
.issue .rank{font-family:var(--f-display);font-size:15px;color:var(--brand);width:32px;height:32px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center}
.issue h4{font-family:var(--f-body);font-weight:500;font-size:14.5px}
.issue q{display:block;font-size:13px;color:var(--muted);margin-top:4px;quotes:"«" "»";overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.issue .n{text-align:end;font-size:13px;white-space:nowrap}
.issue .n b{display:block;font-family:var(--f-display);font-size:18px;font-weight:500}

.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:13.5px}
.hbar span:last-child{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.heat-wrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px;font-size:13px}
.heat th{font-weight:500;color:var(--ink-2);text-align:start;padding:4px 8px;white-space:nowrap}
.heat thead th{text-align:center;font-size:12.5px;color:var(--muted)}
.heat td{text-align:center;border-radius:8px;height:38px;font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- upload wizard ---------- */
.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted);min-width:0}
.steps li b{font-family:var(--f-display);font-weight:500;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:13px}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.on{border-color:var(--brand);color:var(--ink);font-weight:500}
.steps li.on b{background:var(--brand);color:var(--on-brand)}
.steps li.done b{background:var(--brand-soft);color:var(--brand-strong)}
.drop{border:2px dashed var(--brand-line);border-radius:var(--r-xl);background:var(--surface);padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;transition:background .2s,border-color .2s}
.drop.over{background:var(--brand-soft);border-color:var(--brand)}
.drop .ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.drop .ic svg{width:30px;height:30px}
.drop h3{font-size:20px}
.formats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.req{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.req .panel{padding:18px}
.req h4{font-size:14.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.req p{font-size:13.5px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface-2)}
.check .st{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.check .st svg{width:15px;height:15px}
.check.ok .st{background:var(--pos-soft);color:var(--pos)}
.check.warn .st{background:var(--warn-soft);color:var(--warn)}
.check.err .st{background:var(--neg-soft);color:var(--neg)}
.check b{display:block;font-weight:500;font-size:14px}
.check small{color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);max-height:380px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:start;font-weight:500;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line);color:var(--ink-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;max-width:380px}
.tbl tr:last-child td{border-bottom:0}
.tbl th.hl,.tbl td.hl{background:var(--brand-soft)}
.tbl td.hl{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.colcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.colcard:hover{border-color:var(--brand-line)}
.colcard input{position:absolute;opacity:0;pointer-events:none}
.colcard.on{border-color:var(--brand);background:var(--brand-soft)}
.colcard .hd{display:flex;align-items:center;gap:8px;justify-content:space-between}
.colcard b{font-weight:500;font-size:14.5px}
.colcard small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.colcard .radio{width:18px;height:18px;border-radius:6px;border:2px solid var(--brand-line);flex:none}
.colcard.on .radio{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}
.maps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.wiz-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--brand)}
.run{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stages li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-size:14px}
.stages li .st{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.stages li .st svg{width:14px;height:14px}
.stages li.active{background:var(--brand-soft);color:var(--ink);font-weight:500}
.stages li.active .st{border-color:var(--brand);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.stages li.done{color:var(--ink-2)}
.stages li.done .st{border-color:var(--brand);background:var(--brand);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.big-num{font-family:var(--f-display);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.feed-live{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:hidden;mask-image:linear-gradient(to bottom,#000 70%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.feed-live div{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2);animation:slide .35s ease}
.feed-live div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.err-box{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--neg-soft);color:var(--neg);font-size:14px;align-items:flex-start}

/* ---------- explore ---------- */
.explore{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.catlist{display:flex;flex-direction:column;gap:2px;position:sticky;top:90px}
.catlist button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:transparent;text-align:start;font-size:14px;color:var(--ink-2)}
.catlist button:hover{background:var(--surface-2)}
.catlist button.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:500}
.catlist button .c{margin-inline-start:auto;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.catlist button.on .c{color:var(--brand-strong)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters .input{flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:34px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.summary-strip{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.mini-issues{display:flex;flex-direction:column;gap:10px}
.mini-issue{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:12px;align-items:center;font-size:13.5px}
.mini-issue span:last-child{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.phrases{display:flex;flex-wrap:wrap;gap:8px}
.phrase{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.phrase:hover{border-color:var(--brand);color:var(--brand-strong)}
.phrase em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:12px}
.ccard{padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-radius:18px}
.ccard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.ccard .meta b{color:var(--ink-2);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ccard .txt{font-size:15px;line-height:1.85}
.ccard .foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.conf{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.conf .bar{width:64px;height:6px}
.conf.low .bar i{background:var(--warn)}
.why{font-size:12.5px;color:var(--muted)}
.reclass{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.reclass .select{height:34px;font-size:13px}
.stars{color:var(--warn);letter-spacing:1px;direction:ltr}
.stars s{text-decoration:none;color:var(--line)}

/* ---------- reports ---------- */
.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.export-list{display:flex;flex-direction:column;gap:10px;position:sticky;top:90px}
.export{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;width:100%}
.export:hover{border-color:var(--brand)}
.export .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong);font-family:var(--f-display);font-size:11px;flex:none}
.export b{display:block;font-weight:500;font-size:14px}
.export small{color:var(--muted);font-size:12.5px}

/* report document (shared with exported file) */
.rep{--rp:clamp(20px,4vw,48px)}
.rep-cover{background:var(--brand);color:#fff;padding:var(--rp);display:flex;flex-direction:column;gap:28px}
.rep-cover .logo{width:120px;color:#fff}
.rep-cover h1{font-size:clamp(24px,3vw,34px);color:#fff}
.rep-cover .rmeta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13.5px;color:rgba(255,255,255,.82)}
.rep-body{padding:var(--rp);display:flex;flex-direction:column;gap:34px}
.rep h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.rep-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rep-kpis div{border:1px solid var(--line);border-radius:14px;padding:14px}
.rep-kpis small{display:block;color:var(--muted);font-size:12.5px}
.rep-kpis b{font-family:var(--f-display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.rep p,.rep li{font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.rep ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.rep table{width:100%;border-collapse:collapse;font-size:13.5px}
.rep th,.rep td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.rep th{color:var(--muted);font-weight:500;font-size:12.5px}
.rep td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rep .rbar{height:8px;border-radius:3px;background:var(--surface-2);min-width:80px}
.rep .rbar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.rep blockquote{margin:6px 0 0;padding:8px 12px;border-inline-start:3px solid var(--brand-line);color:var(--muted);font-size:13px}
.rep .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rep .rec{border-radius:14px;background:var(--surface-2);padding:16px}
.rep .rec h4{font-size:14.5px;margin-bottom:6px}
.rep .rec p{font-size:13.5px}
.rep-foot{padding:16px var(--rp);border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- files ---------- */
.ds-row td{vertical-align:middle}
.ds-row .nm{display:flex;align-items:center;gap:12px}
.ds-row .fi{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-size:10.5px;font-family:var(--f-display);flex:none}
.ds-row b{font-weight:500}
.ds-row.cur{background:color-mix(in srgb,var(--brand-soft) 50%,transparent)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

/* toast */
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

/* responsive */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c7,.c5,.c8,.c4{grid-column:span 12}
  .report-layout{grid-template-columns:1fr}
  .export-list{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .maps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .rail{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);transition:transform .25s;padding-top:calc(26px + env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .app.nav-open .rail{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,8,30,.45);z-index:25}
  .top .menu{display:inline-grid;border-color:var(--line);background:var(--surface)}
  .top{top:env(safe-area-inset-top,0px)}
  .explore{grid-template-columns:1fr}
  .catlist{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .catlist button{white-space:nowrap;flex:none}
  .summary-strip,.run{grid-template-columns:1fr}
  .checks,.req{grid-template-columns:1fr}
  .steps li span{display:none}
  .steps li.on span{display:inline}
  .search{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:12px}
  .kpi{padding:16px}
  .kpi .k-val{font-size:26px}
  .maps{grid-template-columns:1fr}
  .cat-row{grid-template-columns:minmax(0,1fr) 80px;grid-template-areas:"n v" "b b";row-gap:6px}
  .cat-row .nm{grid-area:n}.cat-row .bar{grid-area:b}.cat-row .vals{grid-area:v}
  .rep-kpis{grid-template-columns:1fr 1fr}
  .hbar{grid-template-columns:90px minmax(0,1fr) 40px}
  .mini-issue{grid-template-columns:minmax(0,1fr) 40px}.mini-issue .bar{display:none}
  .panel{padding:18px}
  .reclass{margin-inline-start:0;width:100%}
  .reclass .select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if (s.lowConf) out.push(`<b class="num">${fmt(s.lowConf)}</b> شكوى صُنّفت بثقة أقل من 70%، ويمكن مراجعتها يدويًا من صفحة الاستكشاف.`);
  return out;
}

async function analyze(table, mapping, opts, onProgress) {
  const { headers, body } = table;
  const rows = [];
  const seen = new Set();
  let dropped = 0, dups = 0;
  for (let i = 0; i < body.length; i++) {
    const r = body[i];
    const text = String(r[mapping.text] ?? '').trim();
    if (text.length < 3) { dropped++; continue; }
    const k = norm(text).replace(/\s+/g, ' ');
    if (opts.dedupe && seen.has(k + '|' + (r[0] ?? ''))) { dups++; continue; }
    seen.add(k + '|' + (r[0] ?? ''));
    const rating = mapping.rating >= 0 ? Number(String(r[mapping.rating]).trim()) : null;
    const c = classify(text, rating);
    rows.push({
      id: rows.length + 1, src: r, text,
      date: mapping.date >= 0 ? parseDate(r[mapping.date]) : null,
      channel: mapping.channel >= 0 ? String(r[mapping.channel] ?? '').trim() : '',
      city: mapping.city >= 0 ? String(r[mapping.city] ?? '').trim() : '',
      rating: rating >= 1 && rating <= 5 ? rating : null,
      ref: String(r[0] ?? ''), ...c, manual: false
    });
    if (onProgress && i % 60 === 0) { onProgress(i / body.length, rows[rows.length - 1]); await tick(); }
  }
  return { rows, dropped, dups, headers };
}

/* ---------- charts ---------- */
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function lineChart(weeks, series, h = 230) {
  const W = window.innerWidth < 640 ? 420 : 720, H = h, pl = 34, pr = 14, pt = 14, pb = 30;
  const n = weeks.length; if (n < 2) return '<p class="muted">لا تكفي التواريخ لرسم الاتجاه.</p>';
  const raw = Math.max(4, ...series.flatMap(s => s.v)) / 4, p10 = Math.pow(10, Math.floor(Math.log10(raw))), stp = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(m => m * p10).find(m => m >= raw), max = stp * 4;
  const x = i => pl + (i * (W - pl - pr)) / (n - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  const step = Math.ceil(n / 7);
  weeks.forEach((w, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${DFs.format(w)}</text>`; });
  let paths = '';
  series.forEach((s, si) => {
    const pts = s.v.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if (si === 0) paths += `<path d="M${pts[0]} L${pts.join(' L')} L${x(n - 1)},${y(0)} L${x(0)},${y(0)}Z" fill="var(--brand)" fill-opacity=".09"/>`;
    paths += `<path d="M${pts.join(' L')}" fill="none" stroke="${s.c}" stroke-width="${si === 0 ? 2.4 : 2}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const lv = s.v[n - 1];
    paths += `<circle cx="${x(n - 1)}" cy="${y(lv)}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="اتجاه الشكاوى الأسبوعي">${g}${paths}</svg>`;
}
function donut(parts) {
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1, R = 54, C = 2 * Math.PI * R; let off = 0, segs = '';
  parts.forEach(p => { const len = (p.v / tot) * C; if (len > 0) segs += `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; });
  return `<svg viewBox="0 0 150 150" role="img" aria-label="توزيع المشاعر"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${segs}<text x="75" y="72" text-anchor="middle" style="font-family:var(--f-display);font-size:24px;fill:var(--ink)">${pct(parts[0].v, tot)}%</text><text x="75" y="92" text-anchor="middle" style="font-size:11px;fill:var(--muted)">سلبية</text></svg>`;
}

        <div class="rep-kpis"><div><small>إجمالي الشكاوى</small><b>${fmt(s.total)}</b></div><div><small>نسبة السلبية</small><b>${pct(s.sent.neg, s.total)}%</b></div><div><small>أولوية عالية</small><b>${fmt(s.pri.high)}</b></div><div><small>${s.avgRating ? 'متوسط التقييم' : 'عدد الفئات'}</small><b>${s.avgRating ? s.avgRating.toFixed(1) + ' / 5' : fmt(s.cats.length)}</b></div></div>
      </section>
      <section><h2><span class="sq"></span>الملخص التنفيذي</h2>
        ${ai ? `<p style="white-space:pre-wrap">${esc(ai)}</p>` : `<ul>${ins.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`}
      </section>
      <section><h2><span class="sq"></span>توزيع الشكاوى حسب الفئة</h2>
        <table><thead><tr><th>الفئة</th><th>العدد</th><th>النسبة</th><th style="width:38%"></th></tr></thead><tbody>
        ${s.cats.map(c => `<tr><td>${esc(c.n)}</td><td class="n">${fmt(c.count)}</td><td class="n">${pct(c.count, s.total)}%</td><td><div class="rbar"><i style="width:${(c.count / s.cats[0].count) * 100}%"></i></div></td></tr>`).join('')}
        </tbody></table>
      </section>
      <section><h2><span class="sq"></span>المشكلات الأكثر تكرارًا</h2>
        <table><thead><tr><th>#</th><th>المشكلة ومثال من العملاء</th><th>الفئة</th><th>العدد</th></tr></thead><tbody>
        ${s.issues.slice(0, 8).map((i, k) => `<tr><td class="n">${k + 1}</td><td>${esc(i.n)}<blockquote>«${esc(i.ex)}»</blockquote></td><td>${esc(CAT[i.cat].n)}</td><td class="n">${fmt(i.c)}</td></tr>`).join('')}
        </tbody></table>
      </section>
      <section><h2><span class="sq"></span>التوصيات</h2>
        <div class="recs">${s.cats.filter(c => c.k !== 'other').slice(0, 3).map((c, i) => `<div class="rec"><h4>${i + 1}. ${esc(c.n)}</h4><p>${esc(c.rec)}</p></div>`).join('')}</div>
      </section>
    </div>
    <footer class="rep-foot"><span>أُعد آليًا بواسطة منصت | Ministry</span><span>${esc(ds.fileName)}</span></footer>
  </article>`;
}
function renderReports() {
  const el = $('#view-reports'), ds = curDS();
  if (!ds) { el.innerHTML = emptyState('لا يوجد تحليل لإعداد تقرير منه'); return; }
  el.innerHTML = `
  <div class="page-head"><div><h2>تقرير النتائج</h2><div class="meta-row">${sample(ds)}<span>${esc(ds.name)}</span></div></div></div>
  <div class="report-layout">
    <div class="doc">${reportHTML(ds)}</div>
    <aside class="export-list">
      <h3 style="font-size:15px;margin-bottom:4px">تصدير</h3>
      <button class="export" data-act="exp-html"><span class="fi">HTML</span><span><b>التقرير الكامل</b><small>صفحة جاهزة للطباعة أو الحفظ PDF</small></span></button>
      <button class="export" data-act="exp-xlsx"><span class="fi">XLSX</span><span><b>البيانات المصنفة (Excel)</b><small>كل شكوى مع فئتها ونبرتها وأولويتها</small></span></button>
      <button class="export" data-act="exp-csv"><span class="fi">CSV</span><span><b>البيانات المصنفة (CSV)</b><small>للاستيراد في أدوات BI أخرى</small></span></button>
      <div class="panel" style="padding:16px;margin-top:6px">
        <span class="ai-chip">${ICON.spark}الملخص التنفيذي</span>
        <p class="muted" style="font-size:13px;margin:6px 0 12px">${S.ai[ds.id] ? 'أُضيف الملخص الذكي إلى التقرير.' : 'أضف ملخصًا يكتبه Claude من نتائج التحليل.'}</p>
        <div id="rep-ai" class="ai-box" data-state="idle" ${S.ai[ds.id] ? 'hidden' : ''}><button class="btn sm primary" data-act="ai">إنشاء الملخص</button></div>
      </div>
    </aside>
  </div>`;
}
function exportRows(ds) {
  const extra = ['الفئة', 'المشكلة', 'النبرة', 'الأولوية', 'نسبة الثقة'];
  const head = [...ds.headers, ...extra];
  const body = ds.rows.map(r => [...ds.headers.map((_, i) => { const v = r.src[i]; return v instanceof Date ? v.toISOString().slice(0, 10) : v ?? ''; }), CAT[r.cat].n, r.issue, SENT[r.sent], PRI[r.pri], Math.round(r.conf * 100) + '%']);
  return [head, ...body];
}
async function save(filename, data) {
  if (!dlCap) { toast('التنزيل غير متاح في هذا العرض. افتح الصفحة في Claude لتنزيل الملفات.'); return; }
  try { await dlCap.save({ filename, data }); toast('تم تجهيز الملف: ' + filename); }
  catch (e) { if (e && e.code === 'declined') toast('أُلغي التنزيل'); else if (e && e.code === 'rate_limited') toast('هناك نافذة تنزيل مفتوحة، أكملها أولًا'); else toast('تعذر تنزيل الملف في هذا العرض'); }
}
const safeName = s => s.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'منصت';
async function doExport(kind) {
  const ds = curDS(); if (!ds) return;
  if (kind === 'csv') {
    const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + exportRows(ds).map(r => r.map(q).join(',')).join('\r\n');
    return save(safeName(ds.name) + ' - مصنفة.csv', csv);
  }
  if (kind === 'xlsx') {
    let X; try { X = await loadXLSX(); } catch (e) { toast('تعذر تحميل مكتبة Excel، استخدم CSV بدلًا منها'); return; }
    const wb = X.utils.book_new();
    const ws = X.utils.aoa_to_sheet(exportRows(ds)); ws['!cols'] = exportRows(ds)[0].map((h, i) => ({ wch: i === ds.mapping.text ? 60 : 16 }));
    X.utils.book_append_sheet(wb, ws, 'الشكاوى المصنفة');
    const s = computeStats(ds);
    const ws2 = X.utils.aoa_to_sheet([['الفئة', 'العدد', 'النسبة'], ...s.cats.map(c => [c.n, c.count, pct(c.count, s.total) / 100])]);
    X.utils.book_append_sheet(wb, ws2, 'ملخص الفئات');
    const ws3 = X.utils.aoa_to_sheet([['المشكلة', 'الفئة', 'العدد', 'مثال'], ...s.issues.map(i => [i.n, CAT[i.cat].n, i.c, i.ex])]);
    X.utils.book_append_sheet(wb, ws3, 'المشكلات المتكررة');
    wb.Workbook = { Views: [{ RTL: true }] };
    const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    return save(safeName(ds.name) + ' - مصنفة.xlsx', new Uint8Array(buf));
  }
  if (kind === 'html') {
    const css = [...document.styleSheets].flatMap(sh => { try { return [...sh.cssRules]; } catch (e) { return []; } }).map(r => r.cssText).filter(t => /^(@font-face|:root|@media \(prefers-color-scheme|\.rep|\.logo|\.sq|\*|body|h1|h2|h3|h4|p\b|\.num)/.test(t)).join('\n');
    const html = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(ds.name)} – تقرير منصت</title><style>${css}\nbody{margin:0;background:var(--bg)}.wrap{max-width:900px;margin:24px auto;background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line)}@media print{body{background:#fff}.wrap{margin:0;border:0;border-radius:0}.rep-cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="wrap">${reportHTML(ds)}</div></body></html>`;
    return save(safeName(ds.name) + ' - تقرير.html', html);
  }
}

/* ---------- files ---------- */
function renderFiles() {
  const el = $('#view-files');
  el.innerHTML = `
  <div class="page-head"><div><h2>الملفات المحللة</h2><p class="muted" style="margin-top:6px">بدّل بين التحليلات أو احذف ما لا تحتاجه. تبقى الملفات في هذه الجلسة فقط.</p></div><a class="btn primary" href="#upload">${ICON.up}تحليل ملف جديد</a></div>
  <div class="panel" style="padding:0;overflow:hidden">
    ${S.datasets.length ? `<div class="tbl-wrap" style="border:0;border-radius:0;max-height:none"><table class="tbl"><thead><tr><th>التحليل</th><th>عدد الشكاوى</th><th>الفئة الأعلى</th><th>نسبة السلبية</th><th>تاريخ التحليل</th><th></th></tr></thead><tbody>
    ${S.datasets.map((d, i) => { const s = computeStats(d); return `<tr class="ds-row ${i === S.cur ? 'cur' : ''}">
      <td><div class="nm"><span class="fi">${esc((d.fileName.split('.').pop() || '').toUpperCase())}</span><div><b>${esc(d.name)}</b><div class="muted" style="font-size:12.5px">${esc(d.fileName)} ${d.source === 'sample' ? '· بيانات تجريبية' : ''}</div></div></div></td>
      <td class="num">${fmt(s.total)}</td><td>${esc(s.cats[0] ? s.cats[0].n : '—')}</td><td class="num">${pct(s.sent.neg, s.total)}%</td><td class="num">${esc(fd(d.analyzedAt))}</td>
      <td style="white-space:nowrap">${S.delConfirm === d.id ? `<span class="confirm">حذف هذا التحليل؟<button class="btn sm" data-act="del-yes" data-i="${i}" style="color:var(--neg)">حذف</button><button class="btn sm ghost" data-act="del-no">إلغاء</button></span>` : `${i === S.cur ? '<span class="pill brand">مفتوح الآن</span>' : `<button class="btn sm" data-act="open-ds" data-i="${i}">فتح</button>`} <button class="btn sm ghost" data-act="del" data-id="${d.id}">حذف</button>`}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">لا توجد ملفات محللة. ابدأ برفع ملف شكاوى.</div>'}
  </div>`;
}

/* ================= events ================= */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'goto-cat') { S.ex = { ...S.ex, cat: b.dataset.cat, limit: 25 }; location.hash = 'explore'; }
  if (a === 'ex') { S.ex[b.dataset.k] = b.dataset.v; S.ex.limit = 25; renderExplore(); }
  if (a === 'more') { S.ex.limit += 25; renderExplore(); }
  if (a === 'phrase') { S.ex.q = b.dataset.p; S.ex.limit = 25; renderExplore(); $('#ex-q').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  if (a === 'use-sample') { const f = new File([genSampleCSV()], 'شكاوى_العملاء_الربع_الثالث.csv', { type: 'text/csv' }); loadFile(f, true); }
  if (a === 'wiz-reset' || a === 'wiz-new') { S.wiz = { step: 0 }; renderUpload(); }
  if (a === 'wiz-next') { S.wiz.step = 2; renderUpload(); }
  if (a === 'wiz-back') { S.wiz.step = 1; renderUpload(); }
  if (a === 'pick-col') { S.wiz.map.text = +b.value; renderUpload(); }
  if (a === 'wiz-run') {
    const w = S.wiz; w.name = $('#ds-name').value.trim() || w.file.name; w.dedupe = $('#dedupe').checked;
    $$('[data-map]').forEach(s => w.map[s.dataset.map] = +s.value);
    runWizard();
  }
  if (a === 'ai') { b.disabled = true; runAI(); }
  if (a === 'exp-csv') doExport('csv');
  if (a === 'exp-xlsx') doExport('xlsx');
  if (a === 'exp-html') doExport('html');
  if (a === 'open-ds') { S.cur = +b.dataset.i; S.ex = { cat: 'all', sent: 'all', pri: 'all', ch: 'all', q: '', sort: 'new', limit: 25 }; toast('فُتح: ' + curDS().name); render(); }
  if (a === 'del') { S.delConfirm = b.dataset.id; renderFiles(); }
  if (a === 'del-no') { S.delConfirm = null; renderFiles(); }
  if (a === 'del-yes') { const i = +b.dataset.i; const nm = S.datasets[i].name; S.datasets.splice(i, 1); if (S.cur >= S.datasets.length) S.cur = Math.max(0, S.datasets.length - 1); else if (i < S.cur) S.cur--; S.delConfirm = null; toast('حُذف: ' + nm); render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'reclass') {
    const ds = curDS(), r = ds.rows.find(x => x.id === +t.dataset.id);
    if (!r || r.cat === t.value) return;
    r.cat = t.value; r.issue = bestIssue(CAT[r.cat], norm(r.text)); r.manual = true; r.conf = 1; ds._stats = null;
    toast('نُقلت الشكوى إلى «' + CAT[r.cat].n + '»'); renderExplore(); renderRail();
  }
  if (t.name === 'txtcol') { S.wiz.map.text = +t.value; renderUpload(); }
});
$('#g-search').addEventListener('submit', ev => { ev.preventDefault(); S.ex.q = $('#g-q').value; S.ex.limit = 25; if (location.hash !== '#explore') location.hash = 'explore'; else renderExplore(); });
$('#menu-btn').onclick = () => $('#app').classList.add('nav-open');
$('#scrim').onclick = () => $('#app').classList.remove('nav-open');
$('#theme-btn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('munsit-theme', root.dataset.theme); } catch (e) { }
};
try { const t = localStorage.getItem('munsit-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
window.addEventListener('hashchange', route);

/* ================= boot ================= */
(async function boot() {
  const text = genSampleCSV();
  const p = parseCSV(text);
  const headers = p.rows[0], body = p.rows.slice(1);
  const g = guessMapping(headers, body);
  const res = await analyze({ headers, body }, g.map, { dedupe: true });
  const ds = makeDS(res, 'شكاوى العملاء – الربع الثالث 2026', 'sample', 'شكاوى_العملاء_الربع_الثالث.csv', g.map);
  ds.analyzedAt = new Date(2026, 9, 25);
  S.datasets.push(ds);
  route();
  initCaps();
})();

</script>
